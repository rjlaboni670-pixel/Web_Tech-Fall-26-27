<!DOCTYPE html>
<html lang = "en-US">
    <head>
        <meta charset = "UTF-8">
        <title>My Profile</title>
        </head>
        <body><h1> My Profile</h1>
            <form>
                <fieldset>
                    <legend>Personal Information </legend>
                    <label for ="Name">Name:</label>
                    <input type="text" name="Name" id="Name" for="Student Name" placeholder="Enter your name">
                    <br> 
                    
                    <label for ="ID">Student ID:</label>
                    <input type="id" name="Student ID" id="ID" step=0.01 for="Student ID">
                    <br>

                    <label for ="CGPA">CGPA:</label>
                    <input type="number" name="CGPA" id="CGPA" for="CGPA">
                    <br>
                    <label for ="DOB">Date of Birth:</label>
                    <input type="date" name="Date Of Birth" id="DOB" for="DOB">
                    <br>
                    <label for="Gender">Gender:</label>
                    <input type="radio" name="Gender" id="Female" value="Female">
                       <label for="Female">Female</label>

                     <input type="radio" name="Gender" id="Male" value="Male">
                       <label for="Male">Male</label>
                       
                       <br>
                       
                    <lable for ="Education">Education:</lable>
                       <table border="1">
                        <tr>
                            <th>Program</th>
                            <th>Major</th>
                            <th>Year</th>
                            <th>Instituion</th>
                        </tr>
                        <tr>
                            <td><input type="text" name="Program1"></td>
                            <td><input type="text" name="Major1"></td>
                            <td><input type="text" name="Year1"></td>
                            <td><input type="text" name="Instituion1"></td>
                            </tr>
                        <tr>
                            <td><input type="text" name="Program2"></td>
                            <td><input type="text" name="Major2"></td>
                            <td><input type="text" name="Year2"></td>
                            <td><input type="text" name="Instituion2"></td>
                        </tr>
                        <tr>
                            <td><input type="text" name="Program3"></td>
                            <td><input type="text" name="Major3"></td>
                            <td><input type="text" name="Year3"></td>
                            <td><input type="text" name="Instituion3"></td>
                            </tr>
                            </table>
                             <br>

                    <label for="ProfilePicture">Profile Picture:</label>
                    <input type="file" id="ProfilePicture"
                           name="ProfilePicture" accept="image/*">
            </fieldset>
            </body>
            </html>
